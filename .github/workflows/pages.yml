name: Pages

on:
  push:
    branches:
      - 'main'
      - 'master'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  queue: max

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages

    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render roadmap with Quarto to _site/roadmap
        shell: bash
        run: bash .tinytau/scripts/build-roadmap.sh

      - name: Copy root pages to _site
        shell: bash
        run: |
          mkdir -p _site
          cp -r .tinytau/page/. _site/

      - name: Build Lean project
        uses: leanprover/lean-action@v1

      - name: Build API documentation and deploy to GitHub Pages
        uses: leanprover-community/docgen-action@main
        with:
          homepage: _site
          build-page: false
          api-docs: true
          use-github-cache: true
          deploy: true
